backend:
  name: git-gateway
  branch: main

# Subida de archivos (fotos y videos)
media_folder: "sebas-ft21/img/uploads"
public_folder: "/img/uploads"

locale: "es"
site_url: https://catalogosebas.netlify.app
display_url: https://catalogosebas.netlify.app

collections:
  # Colección "galeria": un archivo único con una lista de elementos.
  # La página lo lee desde content/galeria.json (sin build ni base de datos).
  - name: "galeria"
    label: "Galería"
    files:
      - name: "galeria"
        label: "Fotos y videos"
        file: "sebas-ft21/content/galeria.json"
        fields:
          - label: "Elementos"
            name: "items"
            widget: "list"
            label_singular: "elemento"
            summary: "{{fields.categoria}} · {{fields.titulo}}"
            fields:
              # Único campo obligatorio
              - label: "Categoría"
                name: "categoria"
                widget: "select"
                options: ["PARTIDOS", "NATURALEZA", "TRABAJO"]
                default: "PARTIDOS"

              # Todo lo demás es opcional
              - { label: "Imagen / Video", name: "media", widget: "file", required: false, hint: "Sube una imagen (jpg, png, webp) o un video corto (mp4, webm)" }
              - { label: "Título", name: "titulo", widget: "string", required: false }
              - { label: "Partido (etiqueta)", name: "partido", widget: "string", required: false, hint: "Opcional. Ej: Final vs Tigres" }
              - { label: "Tipo", name: "tipo", widget: "select", options: ["foto", "video"], required: false, hint: "Opcional. Si lo dejas vacío, la página detecta si es video por la extensión." }
              # Sin "default": Decap la llena sola con la fecha de hoy al agregar un elemento nuevo
              - { label: "Fecha", name: "fecha", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false }